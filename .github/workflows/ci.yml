name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  select-runner:
    uses: ./.github/workflows/select-local-runner.yml
    with:
      cloud-runner: macos-latest
    secrets:
      status-token: ${{ secrets.LOCAL_RUNNER_STATUS_TOKEN }}

  test:
    name: Test (${{ matrix.os }})
    needs: select-runner
    runs-on: ${{ matrix.os == 'macos-latest' && fromJSON(needs.select-runner.outputs.runner) || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify formatting
        if: runner.os != 'Windows'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/tab
      - name: Parse PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  quality:
    name: Quality (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify source file line limit
        run: sh scripts/check-source-lines.sh
      - name: Test source file line checker
        run: sh scripts/test-source-lines.sh
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Check shell scripts
        run: shellcheck install.sh scripts/*.sh
      - name: Check GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  integration:
    name: Integration (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      - name: Race tests
        run: go test -race ./...
      - name: Installer tests
        run: sh scripts/test-install.sh
      - name: tab binary smoke test
        run: sh scripts/tab-binary-smoke.sh
      - name: tmux smoke test
        run: sh scripts/tmux-smoke.sh
